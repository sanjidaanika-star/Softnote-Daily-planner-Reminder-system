<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study plan | Softnote</title>
  <link rel="stylesheet" href="/css/style.css?v=mobile-home-1">
  <script type="module" src="/js/pages.js?v=exam-save-1"></script>
</head>
<body class="public-page workspace-page softnote-theme">
  <header>
    <a class="wordmark" href="/dashboard.html"><svg class="brand-symbol" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6m-6 4h6m-6 4h4"/></svg>Softnote</a>
    <button type="button" id="sign-out">Sign out</button>
  </header>
  <main>
    <div class="workspace-banner"><h1>Study plan</h1></div>
    <p id="error" role="alert" hidden></p>
    <p><a href="/exams.html">Back to exams</a></p>
    <p><a id="edit-exam-link" href="/new-exam.html" hidden>Edit exam</a></p>
    <p><a id="progress-link" href="/progress.html">Progress and history</a></p>
    <div id="plan-countdown" class="plan-countdown" aria-label="Exam countdown"></div>
    <p class="countdown-note">Countdown ends at midnight at the start of exam day, in your local time.</p>
    <section aria-labelledby="plan-active-heading"><h2 id="plan-active-heading">Chapters to study</h2><div id="plan-active-chapters" class="chapter-groups"></div></section>
    <section aria-labelledby="plan-completed-heading"><h2 id="plan-completed-heading">Completed chapters</h2><div id="plan-completed-chapters" class="chapter-groups"></div></section>
    <p id="plan-status" role="status">Loading sessions…</p>
    <table id="plan-table" hidden>
      <caption>Study sessions</caption>
      <thead>
        <tr>
          <th scope="col">Date</th>
          <th scope="col">Chapter</th>
          <th scope="col">Planned minutes</th>
          <th scope="col">Status</th>
          <th scope="col">Revision</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <section aria-labelledby="unscheduled-heading">
      <h2 id="unscheduled-heading">Unscheduled work</h2>
      <p id="unscheduled-status"></p>
      <ul id="unscheduled-list"></ul>
    </section>
  </main>
</body>
</html>
