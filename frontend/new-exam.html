<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add an exam | Softnote</title>
  <link rel="stylesheet" href="/css/style.css?v=course-actions-1">
  <script type="module" src="/js/pages.js?v=course-actions-1"></script>
</head>
<body class="public-page workspace-page softnote-theme">
  <header>
    <a class="wordmark" href="/dashboard.html"><svg class="brand-symbol" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6m-6 4h6m-6 4h4"/></svg>Softnote</a>
    <button type="button" id="sign-out">Sign out</button>
  </header>
  <main>
    <div class="workspace-banner"><h1>Add an exam</h1></div>
    <p id="error" role="alert" hidden></p>
    <form id="exam-form" method="post">
      <div class="academic-fields">
        <label>Semester <select name="semester" id="exam-semester"><option value="0">Not assigned</option></select></label>
        <label>Assessment <select name="assessment"><option value="CT">CT</option><option value="MID">Mid</option><option value="FINAL">Final</option><option value="OTHER" selected>Other</option></select></label>
      </div>
      <label class="exam-wide-field">Course <select id="exam-course" name="courseName"><option value="">Choose a course (optional)</option></select></label>
      <label class="exam-wide-field">Exam title <input name="title" maxlength="255" required></label>
      <label>Exam date <input name="examDate" type="date" required></label>
      <label>Daily minutes <input name="dailyMinutes" type="number" min="1" max="2147483647" required></label>
      <fieldset>
        <legend>Chapters</legend>
        <div id="chapters"></div>
        <button type="button" id="add-chapter">Add chapter</button>
      </fieldset>
      <button type="submit">Save exam</button>
    </form>
    <p id="exam-cancel"><a href="/dashboard.html">Cancel</a></p>
    <section id="exam-save-result" class="exam-save-result" hidden aria-label="Exam saved">
      <p id="exam-save-message" role="status"></p>
      <div class="exam-save-actions">
        <a class="primary-button" href="/new-exam.html">Add another exam</a>
        <a class="secondary-button" href="/dashboard.html">Go to dashboard</a>
      </div>
    </section>
    <template id="chapter-template">
      <fieldset class="chapter">
        <legend>Chapter</legend>
        <label>Chapter name <input name="chapterName" maxlength="255" required></label>
        <label>Difficulty <select name="difficulty">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select></label>
        <label>Estimated minutes <input name="estimatedMinutes" type="number" min="1" max="2147483647" required></label>
        <button type="button" class="remove-chapter">Remove chapter</button>
      </fieldset>
    </template>
  </main>
</body>
</html>
