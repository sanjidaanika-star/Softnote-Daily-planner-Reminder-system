<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password | Softnote</title><meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="/css/style.css?v=all-forms-wide-1"><script type="module" src="/js/reset.js"></script></head>
<body class="public-page workspace-page softnote-theme"><header><a class="wordmark" href="/"><svg class="brand-symbol" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6m-6 4h6m-6 4h4"/></svg>Softnote</a><nav><a href="/login.html">Sign in</a></nav></header>
<main><h1 id="reset-heading">Forgot your password?</h1><p id="reset-intro">Send a request, then contact your administrator to verify your identity and receive a reset link.</p>
<p id="error" role="alert" hidden></p><p id="notice" role="status" hidden></p>
<form id="reset-form"><label id="email-label">Account email <input name="email" type="email" maxlength="254" autocomplete="email" required></label>
<label id="password-label" hidden>New password <input name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" disabled></label>
<label id="confirm-label" hidden>Confirm new password <input name="confirmation" type="password" minlength="8" maxlength="128" autocomplete="new-password" disabled></label>
<button type="submit">Request reset</button></form><p><a href="/login.html">Back to sign in</a></p></main></body></html>
